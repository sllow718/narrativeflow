<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NarrativeFlow Analytics</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8f9fb; color: #1a1a2e; padding: 24px 32px; }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .badge { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; }
    .filter-bar { display: flex; gap: 8px; }
    .filter-bar button { padding: 6px 14px; border: 1.5px solid #e5e7eb; background: #fff; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; color: #6b7280; }
    .filter-bar button.active { background: #6366f1; color: #fff; border-color: #6366f1; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 20px 24px; }
    .card-label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .card-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; color: #111; }
    .card-sub { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .charts { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-box { background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; padding: 20px 24px; }
    .chart-box h3 { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #111; }
    .chart-box canvas { max-height: 300px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1.5px solid #e5e7eb; border-radius: 14px; overflow: hidden; }
    th { text-align: left; padding: 12px 16px; font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.6px; border-bottom: 1.5px solid #e5e7eb; background: #fafafa; }
    td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid #f3f4f6; color: #374151; }
    .empty-state { text-align: center; padding: 48px 24px; color: #9ca3af; }
    .empty-state h2 { font-size: 18px; margin-bottom: 8px; color: #6b7280; }
    @media (max-width: 768px) { body { padding: 16px; } .charts-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>🔥 NarrativeFlow Analytics</h1>
      <span class="badge">BETA</span>
    </div>
    <div class="filter-bar">
      <button data-range="7" class="active">7 days</button>
      <button data-range="30">30 days</button>
      <button data-range="0">All time</button>
    </div>
  </div>

  <div class="cards">
    <div class="card"><div class="card-label">Sessions</div><div class="card-value" id="sessions">—</div><div class="card-sub">workshops run</div></div>
    <div class="card"><div class="card-label">Total Events</div><div class="card-value" id="events">—</div><div class="card-sub">interactions tracked</div></div>
    <div class="card"><div class="card-label">Avg Stickers</div><div class="card-value" id="avgStickers">—</div><div class="card-sub">per session</div></div>
    <div class="card"><div class="card-label">Avg Duration</div><div class="card-value" id="avgDuration">—</div><div class="card-sub">per session</div></div>
  </div>

  <div class="charts">
    <div class="chart-box"><h3>Events Over Time</h3><canvas id="eventsChart"></canvas></div>
    <div class="charts-row">
      <div class="chart-box"><h3>Scenario Popularity</h3><canvas id="scenarioChart"></canvas></div>
      <div class="chart-box"><h3>Tab Flow</h3><canvas id="tabChart"></canvas></div>
    </div>
  </div>

  <div class="chart-box" style="margin-bottom:24px">
    <h3>Recent Sessions</h3>
    <div style="overflow-x:auto">
      <table id="sessionTable"><tbody><tr><td class="empty-state" colspan="5">Loading...</td></tr></tbody></table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // --- Config ---
    // These values come from the same .env / Vite config as the main app
    // For the dashboard, embed them directly since this is a standalone HTML file
    const firebaseConfig = {
      apiKey: "AIzaSyDstkHxkJNv5oy0Tn08WhZWRIm4Lo3LnbE",
      authDomain: "narrativeflow-analytics.firebaseapp.com",
      projectId: "narrativeflow-analytics",
      storageBucket: "narrativeflow-analytics.firebasestorage.app",
      messagingSenderId: "388460183330",
      appId: "1:388460183330:web:50ab2fe69e910287226f7b",
    };

    // --- Init ---
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const sessionsRef = collection(db, "sessions");

    // --- State ---
    let allSessions = [];
    let rangeDays = 7;

    // --- Load ---
    async function loadData() {
      const q = query(sessionsRef, orderBy("startedAt", "desc"), limit(500));
      const snap = await getDocs(q);
      allSessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }

    // --- Filter ---
    function filterSessions() {
      if (rangeDays === 0) return allSessions;
      const cutoff = Date.now() - rangeDays * 86400000;
      return allSessions.filter(s => {
        const ms = s.startedAt?.toMillis?.() || s.startedAt;
        return ms > cutoff;
      });
    }

    // --- Render ---
    function render() {
      const sessions = filterSessions();
      const totalSessions = sessions.length;
      const totalEvents = sessions.reduce((sum, s) => sum + (s.events?.length || 0), 0);
      const sessionsWithStickers = sessions.filter(s => s.totalStickersPlaced > 0);
      const avgStickers = sessionsWithStickers.length
        ? (sessionsWithStickers.reduce((s, x) => s + x.totalStickersPlaced, 0) / sessionsWithStickers.length).toFixed(1)
        : 0;
      const sessionsWithDuration = sessions.filter(s => s.durationMs > 0);
      const avgDurationMs = sessionsWithDuration.length
        ? sessionsWithDuration.reduce((s, x) => s + x.durationMs, 0) / sessionsWithDuration.length
        : 0;
      const avgMin = Math.floor(avgDurationMs / 60000);
      const avgSec = Math.floor((avgDurationMs % 60000) / 1000);

      document.getElementById("sessions").textContent = totalSessions;
      document.getElementById("events").textContent = totalEvents.toLocaleString();
      document.getElementById("avgStickers").textContent = avgStickers;
      document.getElementById("avgDuration").textContent = avgMin + "m " + avgSec + "s";

      // Events over time chart
      const days = {};
      const now = new Date();
      const dayCount = rangeDays || 30;
      for (let i = dayCount - 1; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
        const key = d.toLocaleDateString("en-SG", { month: "short", day: "numeric" });
        days[key] = 0;
      }
      sessions.forEach(s => {
        const ms = s.startedAt?.toMillis?.() || s.startedAt;
        if (!ms) return;
        const d = new Date(ms);
        const key = d.toLocaleDateString("en-SG", { month: "short", day: "numeric" });
        if (days[key] !== undefined) days[key] += s.events?.length || 0;
      });
      const dayLabels = Object.keys(days);
      const dayValues = Object.values(days);

      // Scenario chart
      const scenarioCounts = {};
      sessions.forEach(s => {
        const title = s.scenarioTitle || s.scenarioId || "Unknown";
        scenarioCounts[title] = (scenarioCounts[title] || 0) + 1;
      });

      // Tab flow chart
      const tabCounts = { Brief: 0, Storyboard: 0, Narrative: 0 };
      sessions.forEach(s => {
        if (s.tabsVisited?.includes("brief")) tabCounts.Brief++;
        if (s.tabsVisited?.includes("storyboard")) tabCounts.Storyboard++;
        if (s.tabsVisited?.includes("narrative")) tabCounts.Narrative++;
      });

      // Session table
      const rows = sessions.slice(0, 20);
      const tbody = document.querySelector("#sessionTable tbody");
      if (rows.length === 0) {
        tbody.innerHTML = '<tr><td class="empty-state" colspan="5"><h2>No sessions yet</h2><p>Workshop data will appear here once students start using NarrativeFlow.</p></td></tr>';
      } else {
        tbody.innerHTML = rows.map(r => `
          <tr>
            <td><strong>${esc(r.teamName || "—")}</strong></td>
            <td>${esc(r.scenarioTitle || r.scenarioId || "—")}</td>
            <td>${fmtDuration(r.durationMs)}</td>
            <td>${r.totalStickersPlaced || 0}</td>
            <td>${(r.tabsVisited || []).map(t => t[0]?.toUpperCase()).join(" ")}</td>
          </tr>
        `).join("");
      }

      // Draw charts
      drawChart("eventsChart", "line", dayLabels, dayValues, "#6366f1");
      drawChart("scenarioChart", "bar", Object.keys(scenarioCounts), Object.values(scenarioCounts), "#8b5cf6");
      drawChart("tabChart", "bar", Object.keys(tabCounts), Object.values(tabCounts), "#10b981");
    }

    // --- Helpers ---
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    function fmtDuration(ms) {
      if (!ms || ms <= 0) return "—";
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      return m + "m " + s + "s";
    }

    const charts = {};
    function drawChart(id, type, labels, data, color) {
      if (charts[id]) charts[id].destroy();
      const ctx = document.getElementById(id).getContext("2d");
      charts[id] = new Chart(ctx, {
        type,
        data: {
          labels,
          datasets: [{
            label: id === "eventsChart" ? "Events" : id === "scenarioChart" ? "Sessions" : "Sessions",
            data,
            backgroundColor: type === "line" ? "rgba(99,102,241,0.1)" : color + "cc",
            borderColor: color,
            borderWidth: 2,
            fill: type === "line",
            tension: 0.3,
            pointRadius: type === "line" ? 3 : 0,
            pointBackgroundColor: color,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: "#f3f4f6" } },
            x: { grid: { display: false } }
          }
        }
      });
    }

    // --- Filters ---
    document.querySelectorAll(".filter-bar button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-bar button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        rangeDays = parseInt(btn.dataset.range);
        render();
      });
    });

    // --- Boot ---
    loadData();
  </script>
</body>
</html>
